name: Build and Download

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # DIAGNOSTIC: This will show you which scripts exist
      - name: Show available npm scripts
        run: npm run

      # BUILD: Replace "build" with whatever you saw in the previous step
      - name: Build the project
        run: npm run build   # <--- CHANGE THIS to the correct script name

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: ./dist       # <--- CHANGE THIS to your actual output folder
